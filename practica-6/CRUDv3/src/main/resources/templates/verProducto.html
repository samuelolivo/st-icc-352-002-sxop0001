<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <title>Detalle del Producto</title>
  <style>
    body { background-color: #f8f9fa; }

    .carousel-item img {
      height: 450px;
      object-fit: contain;
      background-color: #e9ecef;
      border-radius: 8px;
    }

    .product-details {
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
      height: 100%;
    }
  </style>
</head>
<body class="container mt-5 mb-5">

<div th:replace="templates/menu.html :: menu"></div>

<div class="row align-items-center mb-2">
  <div class="col-md-6">
    <h2 class="fw-bold text-dark">Ver producto</h2>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-2">
    <a href="/producto/lista" class="btn btn-outline-secondary">Volver</a>
  </div>
</div>

<div class="row g-4">
  <div class="col-md-6">
    <div class="d-flex align-items-center justify-content-center gap-2" th:if="${producto.imagenes != null and !producto.imagenes.isEmpty()}">
      <button class="btn btn-link text-dark p-0 border-0" type="button" data-bs-target="#productCarousel" data-bs-slide="prev" th:if="${producto.imagenes.size() > 1}">
        <i class="bi bi-chevron-left" style="font-size: 2.5rem;"></i>
      </button>

      <div id="productCarousel" class="carousel slide shadow-sm rounded overflow-hidden flex-grow-1" data-bs-interval="false">
        <div class="carousel-inner">
          <div th:each="img, iterStat : ${producto.imagenes}" class="carousel-item" th:classappend="${iterStat.index == 0} ? 'active' : ''">
            <img th:src="${img}" class="d-block w-100" alt="Imagen del producto">
          </div>
        </div>
      </div>

      <button class="btn btn-link text-dark p-0 border-0" type="button" data-bs-target="#productCarousel" data-bs-slide="next" th:if="${producto.imagenes.size() > 1}">
        <i class="bi bi-chevron-right" style="font-size: 2.5rem;"></i>
      </button>
    </div>
  </div>

  <div class="col-md-6">
    <div class="product-details d-flex flex-column">
      <h2 class="fw-bold mb-3 text-dark" th:text="${producto.nombre}"></h2>
      <h2 class="fw-bold mb-4" th:text="'$' + ${producto.precio}"></h2>
      <div class="mb-4">
        <h5 class="fw-bold text-secondary border-bottom pb-2">Descripción</h5>
        <p class="mt-3" th:text="${producto.descripcion}"></p>
      </div>
    </div>
  </div>
</div>

<div class="row mt-5">
  <div class="col-12">
    <div class="product-details">
      <h4 class="fw-bold mb-4">Comentarios</h4>

      <div th:if="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}" class="mb-5">
        <form action="/comentarios/crear" method="post">
          <input type="hidden" name="productoId" th:value="${producto.id}">
          <div class="mb-3">
            <textarea name="contenido" class="form-control" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Publicar comentario</button>
        </form>
      </div>

      <hr>

      <div class="mt-4">
        <div th:each="com : ${comentarios}"
             th:id="'comentario-' + ${com.id}"
             class="card mb-3 shadow-sm">

          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h6 class="fw-bold mb-1" th:text="${com.usuario}"></h6>
                <small class="text-muted" th:text="${#dates.format(com.fechaPublicacion, 'dd/MM/yyyy HH:mm')}"></small>
              </div>

              <a th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}"
                 th:href="@{'/admin/comentarios/eliminar/' + ${com.id} + '/' + ${producto.id}}"
                 class="btn btn-sm btn-outline-danger">
                Eliminar
              </a>
            </div>
            <p class="card-text mt-3" th:text="${com.contenido}"></p>
          </div>
        </div>

        <div th:if="${comentarios.isEmpty()}" class="text-center text-muted py-4">
          <p>Aun no hay comentarios.</p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
