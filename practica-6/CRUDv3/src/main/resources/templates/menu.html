<div th:fragment="menu" class="d-flex justify-content-end align-items-center gap-2">

  <div class="d-flex align-items-center">
      <span class="badge bg-info text-dark fw-bold">
          En línea: <span id="contador-usuarios">1</span>
      </span>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-2">
    <a href="/usuario/lista" class="btn btn-secondary position-relative text-white fw-bold">
      Usuarios </a>
    <a href="/producto/lista" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
      <span>Productos</span>
    </a>

    <a href="/carrito" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
      <span>Carrito</span>

      <span class="badge rounded-pill bg-light text-dark shadow-sm"
            th:text="${cantidadCarrito}">0</span>
    </a>

    <a th:if="${usuario != null && usuario.rol.name() == 'ADMIN'}" href="/admin/ventas" class="btn btn-secondary text-white fw-bold">Dashboard Ventas</a>
  </div>

  <div th:if="${usuario == null or usuario.rol.name() == 'NO_AUTENTICADO'}">
    <a href="/login" class="btn btn-primary text-white fw-bold">
      Iniciar Sesión
    </a>
  </div>

  <div th:if="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}"
       class="d-flex align-items-center gap-2">

        <span class="text-muted small"
              th:text="${'Hola, ' + usuario.usuario}">
        </span>

    <a href="/logout" class="btn btn-outline-danger fw-bold">
      Cerrar Sesión
    </a>
  </div>
  <script>
    (function() {
      const protocol = location.protocol === "https:" ? "wss://" : "ws://";
      const socket = new WebSocket(protocol + location.host + "/ws/notificaciones");

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("Mensaje recibido:", data);

        if (data.tipo === "CONTEO_USUARIOS") {
          const el = document.getElementById("contador-usuarios");
          if (el) el.innerText = data.cantidad;
        }

        if (data.tipo === "ELIMINAR_COMENTARIO") {
          const comentarioDiv = document.getElementById("comentario-" + data.id);
          if (comentarioDiv) {
            comentarioDiv.style.transition = "all 0.5s ease";
            comentarioDiv.style.opacity = "0";
            comentarioDiv.style.transform = "translateX(20px)";
            setTimeout(() => comentarioDiv.remove(), 500);
          }
        }
      };

      socket.onclose = () => console.warn("WebSocket cerrado. Reintentando...");
    })();
  </script>
  </script>
</div>
