<div th:fragment="menu" class="d-flex justify-content-end align-items-center gap-2">

  <div class="d-flex justify-content-end align-items-center gap-2">
    <a href="/usuario/lista" class="btn btn-secondary position-relative text-white fw-bold">
      Usuarios </a>
    <a href="/producto/lista" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
      <span>Productos</span>
    </a>

    <a href="/carrito" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
      <span>Carrito</span>

      <span class="badge rounded-pill bg-light text-dark shadow-sm"
            th:text="${cantidadCarrito}">0</span>
    </a>

    <a th:if="${usuario != null && usuario.rol.name() == 'ADMIN'}" href="/admin/ventas" class="btn btn-secondary text-white fw-bold">Ventas Realizadas</a>
  </div>

  <div th:if="${usuario == null or usuario.rol.name() == 'NO_AUTENTICADO'}">
    <a href="/login" class="btn btn-primary text-white fw-bold">
      Iniciar Sesión
    </a>
  </div>

  <div th:if="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}"
       class="d-flex align-items-center gap-2">

        <span class="text-muted small"
              th:text="${'Hola, ' + usuario.usuario}">
        </span>

    <a href="/logout" class="btn btn-outline-danger fw-bold">
      Cerrar Sesión
    </a>
  </div>
</div>
