<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Administración - Editar Producto</title>
</head>
<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h3 class="card-title mb-0">Modificar Producto</h3>
            </div>
            <div class="card-body">
                <form action="/admin/actualizarProducto" method="post">
                    <input type="hidden" name="id" th:value="${producto.id}">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre del Producto</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                               th:value="${producto.nombre}" required>
                    </div>

                    <div class="mb-3">
                        <label for="precio" class="form-label">Precio</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" id="precio" name="precio" step="0.01"
                                   class="form-control" th:value="${producto.precio}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Cantidad (Stock)</label>
                        <input type="number" id="cantidad" name="cantidad" class="form-control"
                               th:value="${producto.cantidad}" min="0" required>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/productos" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted small">
                Editando producto ID: <span th:text="${producto.id}">0</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
