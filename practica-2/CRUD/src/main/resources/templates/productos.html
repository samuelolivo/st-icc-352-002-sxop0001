<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listar productos</title>
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Listado de Productos</h2>

    <div th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}">
        <a href="/admin/crearProducto" class="btn btn-success">
            + Crear Nuevo Producto
        </a>
    </div>
</div>

<table class="table table-hover">
    <thead class="table-dark">
    <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Acción</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}">
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.cantidad}"></td>
        <td>
            <div th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}">
                <a th:href="'/admin/editarProducto/' + ${p.id}" class="btn btn-warning btn-sm">Editar</a>

                <a th:href="'/admin/eliminarProducto/' + ${p.id}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</a>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
