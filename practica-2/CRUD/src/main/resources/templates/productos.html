<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listar productos</title>
    <style>
        body { background-color: #f8f9fa; }
        .table-hover tbody tr.selected {
            background-color: rgba(13, 110, 253, 0.1);
            cursor: pointer;
            border-left: 5px solid #0d6efd;
        }
        tr { cursor: pointer; transition: all 0.2s; }
        .table { background: white; border-radius: 8px; overflow: hidden; }

        .col-comprar { width: 120px; }
    </style>
</head>
<body class="container mt-5">

<div class="row align-items-center mb-2">
    <div class="col-md-6">
        <h2 class="fw-bold text-dark">Listado de Productos</h2>
    </div>

    <div class="d-flex justify-content-end align-items-center gap-2">
        <div class="d-flex justify-content-end align-items-center gap-2">
            <a href="/usuarios" class="btn btn-secondary position-relative text-white fw-bold">
                Usuarios </a>
            <a href="/carrito" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
                <span>Carrito</span>

                <span class="badge rounded-pill bg-light text-dark shadow-sm"
                      th:text="${cantidadCarrito}">0</span>
            </a>
            <a th:if="${usuario != null && usuario.rol.name() == 'ADMIN'}" href="/admin/ventas" class="btn btn-secondary text-white fw-bold">Ventas Realizadas</a>
        </div>

        <div th:if="${usuario == null or usuario.rol.name() == 'NO_AUTENTICADO'}">
            <a href="/login" class="btn btn-primary text-white fw-bold">Iniciar Sesión</a>
        </div>

        <div th:if="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}" class="d-flex align-items-center gap-2">
            <span class="text-muted small" th:text="${'Hola, ' + usuario.usuario}"></span>
            <a href="/logout" class="btn btn-outline-danger fw-bold">Cerrar Sesión</a>
        </div>
    </div>
</div>

<div th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}" class="row mb-4">
    <div class="col-12">
        <hr> <div class="d-flex gap-2 mt-2">
        <a href="/admin/crearProducto" class="btn btn-success px-4 shadow-sm">Crear producto</a>
        <a id="btnEditar" href="#" class="btn btn-warning disabled px-4 shadow-sm">Editar</a>
        <a id="btnEliminar" href="#" class="btn btn-danger disabled px-4 shadow-sm"
           onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</a>
    </div>
    </div>
</div>

<table class="table table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
        <th class="py-3 ps-4">Producto</th>
        <th class="py-3">Precio</th>
        <th class="py-3">Stock</th>
        <th class="py-3 text-center col-comprar">Compra</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}" th:attr="data-id=${p.id}" class="producto-row">
        <td th:text="${p.nombre}" class="fw-bold ps-4"></td>
        <td th:text="'$' + ${p.precio}"></td>
        <td th:text="${p.cantidad}"></td>
        <td class="text-center">
            <a th:href="${p.cantidad > 0} ? '/carrito/agregar/' + ${p.id} : '#'"
               th:classappend="${p.cantidad <= 0} ? 'disabled btn-secondary' : 'btn-outline-primary'"
               class="btn btn-sm">
                <span th:text="${p.cantidad > 0} ? 'Agregar' : 'Agotado'"></span>
            </a>
        </td>
    </tr>
    </tbody>
</table>



<script>
    const rows = document.querySelectorAll('.producto-row');
    const btnEditar = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');

    rows.forEach(row => {
        row.addEventListener('click', (e) => {

            if (e.target.classList.contains('btn')) return;

            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
            const id = row.getAttribute('data-id');

            if (btnEditar && btnEliminar) {
                btnEditar.classList.remove('disabled');
                btnEditar.href = `/admin/editarProducto/${id}`;

                btnEliminar.classList.remove('disabled');
                btnEliminar.href = `/admin/eliminarProducto/${id}`;
            }
        });
    });
</script>

</body>
</html>
