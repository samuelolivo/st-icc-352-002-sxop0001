<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listar productos</title>
    <style>
        body { background-color: #f8f9fa; }
        .table-hover tbody tr.selected {
            background-color: rgba(13, 110, 253, 0.1);
            cursor: pointer;
            border-left: 5px solid #0d6efd;
        }
        tr { cursor: pointer; transition: all 0.2s; }
        .table { background: white; border-radius: 8px; overflow: hidden; }

        .col-comprar { width: 120px; }
    </style>
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark">Listado de Productos</h2>

    <div class="d-flex gap-2">
        <a href="/carrito" class="btn btn-info position-relative me-3 text-white fw-bold">
            Ver Carrito
        </a>

        <div th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}" class="d-flex gap-2">
            <a id="btnEditar" href="#" class="btn btn-warning disabled px-4">Editar</a>
            <a id="btnEliminar" href="#" class="btn btn-danger disabled px-4"
               onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</a>
            <a href="/admin/crearProducto" class="btn btn-success px-4">Crear Nuevo</a>
        </div>
    </div>
</div>

<table class="table table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
        <th class="py-3 ps-4">Producto</th>
        <th class="py-3">Precio</th>
        <th class="py-3">Stock</th>
        <th class="py-3 text-center col-comprar">Compra</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}" th:attr="data-id=${p.id}" class="producto-row">
        <td th:text="${p.nombre}" class="fw-bold ps-4"></td>
        <td th:text="'$' + ${p.precio}"></td>
        <td th:text="${p.cantidad}"></td>
        <td class="text-center">
            <a th:href="${p.cantidad > 0} ? '/carrito/agregar/' + ${p.id} : '#'"
               th:classappend="${p.cantidad <= 0} ? 'disabled btn-secondary' : 'btn-outline-primary'"
               class="btn btn-sm">
                <span th:text="${p.cantidad > 0} ? 'Agregar' : 'Agotado'"></span>
            </a>
        </td>
        </td>
    </tr>
    </tbody>
</table>



<script>
    const rows = document.querySelectorAll('.producto-row');
    const btnEditar = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');

    rows.forEach(row => {
        row.addEventListener('click', (e) => {

            if (e.target.classList.contains('btn')) return;

            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
            const id = row.getAttribute('data-id');

            if (btnEditar && btnEliminar) {
                btnEditar.classList.remove('disabled');
                btnEditar.href = `/admin/editarProducto/${id}`;

                btnEliminar.classList.remove('disabled');
                btnEliminar.href = `/admin/eliminarProducto/${id}`;
            }
        });
    });
</script>

</body>
</html>
