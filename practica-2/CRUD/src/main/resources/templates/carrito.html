<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <title>Mi Carrito</title>
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Resumen de Compra</h2>
    <a href="/productos" class="btn btn-outline-secondary">Seguir Comprando</a>
</div>

<div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${mensajeError}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="card shadow-sm mb-4">
    <table class="table mb-0">
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th class="text-center">Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.nombre}"></td>
            <td th:text="'$' + ${p.precio}"></td>
            <td class="text-center">
                <a th:href="'/carrito/eliminar/' + ${p.id}" class="btn btn-danger btn-sm">Quitar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productos)}">
            <td colspan="3" class="text-center py-4 text-muted">El carrito está vacío</td>
        </tr>
        </tbody>
    </table>
</div>

<div class="row">
    <div class="col-md-6">
        <h3 class="fw-bold">Total a pagar: <span class="text-primary" th:text="'$' + ${total}">0</span></h3>
    </div>
    <div class="col-md-6" th:if="${not #lists.isEmpty(productos)}">
        <div class="card p-3 border-primary">
            <form action="/carrito/procesar" method="post">
                <label class="form-label fw-bold">Nombre del Cliente para la Factura:</label>
                <div class="input-group">
                    <input type="text" name="nombreCliente" class="form-control" placeholder="Gustavo" required>
                    <button type="submit" class="btn btn-success">Finalizar Compra</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
