<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title th:text="${encuesta != null} ? 'Editar Encuesta' : 'Nueva Encuesta'">Nueva Encuesta</title>
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; border: none; }
        #video-preview { width: 100%; border-radius: 10px; background: #000; }
        #photo-canvas { display: none; }
        .foto-preview-container { position: relative; }
        .badge-snap { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <h2 class="fw-bold mb-4" th:text="${encuesta != null} ? 'Editar Encuesta' : 'Registro de Encuesta'">Registro de Encuesta</h2>

            <form id="formEncuesta">
                <input type="hidden" id="encuestaId" th:value="${encuesta != null ? encuesta.id : ''}">

                <div id="metadata" style="display: none;"
                     th:data-foto="${encuesta != null ? encuesta.fotoBase64 : ''}"
                     th:data-lat="${encuesta != null ? encuesta.ubicacion.latitud : 0}"
                     th:data-lon="${encuesta != null ? encuesta.ubicacion.longitud : 0}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre Completo</label>
                    <input type="text" id="nombre" class="form-control"
                           th:value="${encuesta != null ? encuesta.nombre : ''}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Sector / Barrio</label>
                        <input type="text" id="sector" class="form-control"
                               th:value="${encuesta != null ? encuesta.sector : ''}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Nivel Escolar</label>
                        <select id="nivelEscolar" class="form-select">
                            <option value="BASICO" th:selected="${encuesta != null and encuesta.nivelEscolar.name() == 'BASICO'}">Básico</option>
                            <option value="MEDIO" th:selected="${encuesta != null and encuesta.nivelEscolar.name() == 'MEDIO'}">Medio</option>
                            <option value="UNIVERSITARIO" th:selected="${encuesta != null and encuesta.nivelEscolar.name() == 'UNIVERSITARIO'}">Grado Universitario</option>
                            <option value="POSTGRADO" th:selected="${encuesta != null and encuesta.nivelEscolar.name() == 'POSTGRADO'}">Postgrado</option>
                            <option value="DOCTORADO" th:selected="${encuesta != null and encuesta.nivelEscolar.name() == 'DOCTORADO'}">Doctorado</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6 foto-preview-container">
                        <label class="form-label fw-bold">Foto (Cámara)</label>
                        <video id="video-preview" autoplay playsinline></video>
                        <button type="button" id="btnSnap" class="btn btn-outline-primary btn-sm w-100 mt-2">
                            <i class="bi bi-camera"></i> Capturar Nueva Foto
                        </button>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Coordenadas</label>
                        <div class="alert alert-info">
                            <small>Latitud: <span id="lat">Cargando...</span></small><br>
                            <small>Longitud: <span id="lon">Cargando...</span></small>
                        </div>
                        <p class="text-muted small" th:if="${encuesta != null}">
                            Las coordenadas no se pueden modificar
                        </p>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 border-top pt-4">
                    <a href="/encuesta" class="btn btn-outline-secondary px-4 shadow-sm">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary px-5 shadow-sm fw-bold">
                        <i class="bi bi-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<canvas id="photo-canvas"></canvas>

<script>

    const meta = document.getElementById('metadata');
    let fotoBase64 = meta.getAttribute('data-foto') || "";
    let latitud = parseFloat(meta.getAttribute('data-lat')) || 0;
    let longitud = parseFloat(meta.getAttribute('data-lon')) || 0;

    document.getElementById('lat').innerText = latitud !== 0 ? latitud : "...";
    document.getElementById('lon').innerText = longitud !== 0 ? longitud : "...";


    if (latitud === 0) {
        navigator.geolocation.getCurrentPosition(p => {
            latitud = p.coords.latitude;
            longitud = p.coords.longitude;
            document.getElementById('lat').innerText = latitud;
            document.getElementById('lon').innerText = longitud;
        }, (error) => {
            console.error("Error obteniendo ubicación:", error);
            alert("Por favor, permite el acceso a la ubicación.");
        });
    }


    const video = document.getElementById('video-preview');
    navigator.mediaDevices.getUserMedia({video: true})
        .then(s => video.srcObject = s)
        .catch(err => console.warn("No se pudo acceder a la cámara:", err));

    document.getElementById('btnSnap').addEventListener('click', () => {
        const canvas = document.getElementById('photo-canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        fotoBase64 = canvas.toDataURL('image/png');
        alert("¡Foto capturada con éxito!");
    });

    document.getElementById('formEncuesta').addEventListener('submit', async (e) => {
        e.preventDefault();

        const idExistente = document.getElementById('encuestaId').value;

        const payload = {

            id: idExistente === "" ? null : idExistente,
            nombre: document.getElementById('nombre').value,
            sector: document.getElementById('sector').value,
            nivelEscolar: document.getElementById('nivelEscolar').value,
            ubicacion: { latitud, longitud },
            fotoBase64: fotoBase64
        };

        try {
            const response = await fetch('/encuesta/guardar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (response.ok) {

                window.location.href = "/encuesta";
            } else {
                const errorData = await response.text();
                alert("Error al procesar: " + errorData);
            }
        } catch (err) {
            console.error("Error en el fetch:", err);
            alert("No se pudo conectar con el servidor.");
        }
    });
</script>
</body>
</html>
