<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Usuarios</title>

    <style>
        body { background-color: #f8f9fa; }
        .table-hover tbody tr.selected {
            background-color: rgba(13,110,253,0.1);
            cursor: pointer;
            border-left: 5px solid #0d6efd;
        }
        tr { cursor: pointer; transition: all 0.2s; }
        .table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .badge-rol { font-size: 0.85rem; }
    </style>
</head>

<body class="container mt-5">

<div th:replace="templates/menu.html :: menu"></div>

<div class="row align-items-center mb-4">
    <div class="col-md-6">
        <h2 class="fw-bold text-dark">Listado de Usuarios</h2>
    </div>
</div>

<div th:if="${rol != null and rol == 'ADMIN'}">
    <div th:replace="templates/botonesCrud.html :: botonesCrud"></div>
</div>

<div class="table-responsive">
    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
        <tr>
            <th class="py-3 ps-4">Nombre</th>
            <th class="py-3">Email</th>
            <th class="py-3">Rol</th>
            <th class="py-3 text-center">Estado</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${usuarios}"
            th:attr="data-id=${u.id}, data-email=${u.email}"
            class="usuario-row">

            <td th:text="${u.nombre}" class="ps-4 fw-bold"></td>
            <td th:text="${u.email}"></td>
            <td>
                <span th:text="${u.rol}"
                      th:classappend="${u.rol.name() == 'ADMIN' ? 'badge bg-primary' : 'badge bg-info text-dark'}"
                      class="badge-rol px-2 py-1">
                </span>
            </td>
            <td class="text-center">
                <span class="badge bg-success">Activo</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script th:if="${rol != null and rol == 'ADMIN'}">
    const rows = document.querySelectorAll('.usuario-row');
    const btnCrear = document.getElementById('btnCrear');
    const btnEditar = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');

    rows.forEach(row => {
        row.addEventListener('click', () => {
            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');

            const id = row.getAttribute('data-id');
            const email = row.getAttribute('data-email');

            if (email !== "admin@admin.com") {
                btnEditar.classList.remove('disabled');
                btnEditar.dataset.target = `/admin/usuarios/editar/${id}`;

                btnEliminar.classList.remove('disabled');
                btnEliminar.dataset.target = `/admin/usuarios/eliminar/${id}`;
            } else {
                btnEditar.classList.add('disabled');
                btnEliminar.classList.add('disabled');
                btnEditar.removeAttribute('data-target');
                btnEliminar.removeAttribute('data-target');
            }
        });
    });

    btnCrear.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = "/admin/usuarios/crear";
    });

    btnEditar.addEventListener('click', (e) => {
        e.preventDefault();
        if (!btnEditar.classList.contains('disabled') && btnEditar.dataset.target) {
            window.location.href = btnEditar.dataset.target;
        }
    });

    btnEliminar.addEventListener('click', (e) => {
        e.preventDefault();
        if (!btnEliminar.classList.contains('disabled') && btnEliminar.dataset.target) {
            if (confirm('¿Seguro que deseas desactivar este usuario?')) {
                window.location.href = btnEliminar.dataset.target;
            }
        }
    });
</script>

</body>
</html>
