<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Mapa de Registros</title>
    <style>
        body { background-color: #f8f9fa; }
        #map {
            height: 500px;
            width: 100%;
            border-radius: 12px;
            z-index: 1;
        }
        @media (max-width: 768px) {
            #map { height: 70vh; }
            .h2-responsive { font-size: 1.3rem; }
        }
    </style>
</head>
<body class="container py-3 py-md-5">

<div th:replace="~{templates/menu.html :: menu}"></div>

<div class="row align-items-center mb-4 g-2">
    <div class="col-12 d-flex align-items-center gap-3">
        <a href="/encuesta" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <h2 class="fw-bold text-dark h2-responsive mb-0">Mapa de ubicaciones de registro</h2>
    </div>
</div>

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', {
        scrollWheelZoom: false
    }).setView([18.7357, -70.1627], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const marcas = [];

    fetch('/encuesta/mapa/puntos')
        .then(r => r.json())
        .then(data => {
            data.forEach(e => {
                if(e.ubicacion && e.ubicacion.latitud && e.ubicacion.longitud) {
                    const lat = e.ubicacion.latitud;
                    const lon = e.ubicacion.longitud;

                    const circuloRojo = {
                        radius: 8,
                        fillColor: "#ff3300",
                        color: "#ffffff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    };

                    L.circleMarker([lat, lon], circuloRojo)
                        .addTo(map)
                        .bindPopup(`
                            <div style="font-family: sans-serif; min-width: 150px;">
                                <h6 style="margin-bottom: 5px; color: #333; font-weight: bold;">${e.nombre}</h6>
                                <hr style="margin: 5px 0;">
                                <small>
                                    <b>Sector:</b> ${e.sector}<br>
                                    <b>Nivel:</b> ${e.nivelEscolar || 'N/A'}<br>
                                    <b>Usuario:</b> ${e.usuarioId}
                                </small>
                            </div>
                        `);

                    marcas.push([lat, lon]);
                }
            });

            if (marcas.length > 0) {
                const bounds = L.latLngBounds(marcas);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        });
    map.on('focus', () => { map.scrollWheelZoom.enable(); });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
