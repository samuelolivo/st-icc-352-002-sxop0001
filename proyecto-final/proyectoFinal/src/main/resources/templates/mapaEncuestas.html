<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Mapa de Registros</title>
    <style>#map { height: 500px; width: 100%; border-radius: 10px; }</style>
</head>
<body class="container mt-5">

<div class="row align-items-left mb-4">
    <div class="col-md-12">
        <a href="/" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
            Volver
        </a>
    </div>
</div>

<div class="row align-items-center mb-4">
    <div class="col-md-12">
        <h2 class="fw-bold text-dark">Mapa de ubicaciones de registro de encuestas</h2>
    </div>
</div>
<div id="map" class="shadow"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([18.7357, -70.1627], 8); // Centrado en RD
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const marcas = [];
    
    fetch('/encuesta/mapa/puntos').then(r => r.json()).then(data => {
        data.forEach(e => {
            if(e.ubicacion && e.ubicacion.latitud && e.ubicacion.longitud) {

                const lat = e.ubicacion.latitud;
                const lon = e.ubicacion.longitud;

                
                const circuloRojo = {
                    radius: 8,
                    fillColor: "#ff3300", 
                    color: "#ffffff",     
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                };
                
                const marker = L.circleMarker([lat, lon], circuloRojo)
                    .addTo(map)
                    .bindPopup(`
                                <div style="font-family: sans-serif;">
                                    <h6 class="mb-1">${e.nombre}</h6>
                                    <hr class="my-1">
                                    <b>Sector:</b> ${e.sector}<br>
                                    <b>Nivel:</b> ${e.nivelEscolar || 'N/A'}<br>
                                    <b>Usuario:</b> ${e.usuarioId}
                                </div>
                            `);

                marcas.push([lat, lon]);
            }
        });

        if (marcas.length > 0) {
            const bounds = L.latLngBounds(marcas);
            map.fitBounds(bounds, { padding: [50, 50] });
        }
    });
    
</script>
</body>
</html>
