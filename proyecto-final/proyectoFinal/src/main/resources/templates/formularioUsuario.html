<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title th:text="${usuario != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></title>
    <style>
        body { background-color: #f8f9fa; }
        .card-form {
            border: none;
            border-radius: 15px;
            max-width: 450px;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #495057;
            text-transform: uppercase;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.6rem 1rem;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
        }
        @media (max-width: 576px) {
            .container { padding-top: 1rem !important; }
            .card-form { border-radius: 0; box-shadow: none !important; background: transparent; }
        }
    </style>
</head>
<body class="container py-5">

<div class="card card-form shadow-lg p-4 mx-auto bg-white">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark" th:text="${usuario != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></h3>
        <p class="text-muted small">Completa la información del perfil</p>
    </div>

    <form id="formUsuario">
        <input type="hidden" id="userId" th:value="${usuario != null ? usuario.id : ''}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombre" class="form-control"
                   th:value="${usuario != null ? usuario.nombre : ''}"
                   placeholder="Carlos Camacho" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control"
                   th:value="${usuario != null ? usuario.email : ''}"
                   placeholder="usuario@correo.com" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Dejar en blanco para no cambiar">
            <div th:if="${usuario != null}" class="form-text small">Solo llena este campo si deseas cambiar la clave.</div>
        </div>

        <div class="mb-4">
            <label class="form-label">Rol de Acceso</label>
            <select id="rol" class="form-select">
                <option value="ENCUESTADOR" th:selected="${usuario != null and usuario.rol.name() == 'ENCUESTADOR'}">Encuestador</option>
                <option value="ADMIN" th:selected="${usuario != null and usuario.rol.name() == 'ADMIN'}">Administrador</option>
                <option value="BRECHADOR" th:selected="${usuario != null and usuario.rol.name() == 'BRECHADOR'}">Brechador</option>
            </select>
        </div>

        <button type="submit" id="btnGuardar" class="btn btn-primary w-100 py-2 fw-bold shadow-sm rounded-pill">
            Guardar Cambios
        </button>
    </form>

    <div class="text-center mt-4 border-top pt-3">
        <a href="/usuarios" class="text-decoration-none text-muted small fw-bold">
            Cancelar y Volver
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('formUsuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const idVal = document.getElementById('userId').value;
        const payload = {
            id: idVal === "" ? null : idVal,
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            rol: document.getElementById('rol').value
        };

        const resp = await fetch('/admin/usuarios/guardar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (resp.ok) window.location.href = "/usuarios";
        else alert("Error al guardar");
    });
</script>
</body>
</html>
