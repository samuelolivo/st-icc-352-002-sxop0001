<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title th:text="${usuario != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></title>
</head>
<body class="container mt-5">
<div class="card shadow p-4 mx-auto" style="max-width: 500px;">
    <h2 th:text="${usuario != null} ? 'Editar Usuario' : 'Registro de Usuario'"></h2>
    <form id="formUsuario">
        <input type="hidden" id="userId" th:value="${usuario != null ? usuario.id : ''}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombre" class="form-control" th:value="${usuario != null ? usuario.nombre : ''}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" th:value="${usuario != null ? usuario.email : ''}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="Hola Camacho">
        </div>
        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select id="rol" class="form-select">
                <option value="ENCUESTADOR" th:selected="${usuario != null and usuario.rol.name() == 'ENCUESTADOR'}">Encuestador</option>
                <option value="ADMIN" th:selected="${usuario != null and usuario.rol.name() == 'ADMIN'}">Administrador</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Guardar Usuario</button>
    </form>
</div>

<script>
    document.getElementById('formUsuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const idVal = document.getElementById('userId').value;
        const payload = {
            id: idVal === "" ? null : idVal,
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            rol: document.getElementById('rol').value
        };

        const resp = await fetch('/usuarios/guardar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (resp.ok) window.location.href = "/usuarios";
        else alert("Error al guardar");
    });
</script>
</body>
</html>
