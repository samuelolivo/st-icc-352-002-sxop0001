<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <title>Cliente gRPC</title>
  <style>
    body { background-color: #fcfaf7; font-family: sans-serif; }
    .card-custom { border-radius: 10px; border: 1px solid #eee; background: white; margin-bottom: 20px; }
    .label-custom { font-size: 11px; font-weight: bold; color: #666; margin-bottom: 5px; }
    #video-preview, #img-preview {
      width: 100%;
      max-height: 250px;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }
    #photo-canvas { display: none; }
  </style>
</head>
<body class="container py-4">

<div th:replace="~{templates/menu.html :: menu}"></div>

<h5 class="mb-4"><i class="bi bi-cpu-fill"></i> Cliente gRPC Avanzado</h5>

<div class="row">
  <div class="col-md-8">
    <div class="card card-custom p-4 shadow-sm">
      <p class="small text-muted mb-3"><i class="bi bi-shield-lock"></i> Credenciales de Acceso</p>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="label-custom">USUARIO (EMAIL)</label>
          <input type="text" id="usuario" class="form-control form-control-sm" placeholder="admin@admin.com">
        </div>
        <div class="col-md-6">
          <label class="label-custom">CONTRASEÑA</label>
          <input type="password" id="password" class="form-control form-control-sm" placeholder="********">
        </div>
      </div>

      <hr>

      <p class="small text-muted mb-3"><i class="bi bi-pencil-square"></i> Datos de la Encuesta</p>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="label-custom">NOMBRE</label>
          <input type="text" id="nombre" class="form-control form-control-sm">
        </div>
        <div class="col-md-6">
          <label class="label-custom">SECTOR</label>
          <input type="text" id="sector" class="form-control form-control-sm">
        </div>
        <div class="col-md-6">
          <label class="label-custom">NIVEL ESCOLAR</label>
          <select id="nivel" class="form-control form-control-sm">
            <option value="BASICO">Básico</option>
            <option value="MEDIO">Medio</option>
            <option value="UNIVERSITARIO">Grado</option>
            <option value="POSTGRADO">Postgrado</option>
            <option value="DOCTORADO">Doctorado</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="label-custom">LATITUD</label>
          <input type="text" id="lat" class="form-control form-control-sm" readonly value="18.4749">
        </div>
        <div class="col-md-3">
          <label class="label-custom">LONGITUD</label>
          <input type="text" id="lon" class="form-control form-control-sm" readonly value="-69.9307">
        </div>
      </div>

      <button class="btn btn-dark mt-4 w-100" onclick="enviar()">
        <i class="bi bi-send"></i> Crear formulario via gRPC
      </button>
      <div id="resultado" class="mt-3 small text-center fw-bold"></div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card card-custom p-3 shadow-sm text-center">
      <label class="label-custom d-block mb-2">EVIDENCIA FOTOGRÁFICA</label>
      <video id="video-preview" autoplay playsinline></video>
      <img id="img-preview" style="display: none;">

      <button type="button" id="btnSnap" class="btn btn-outline-dark btn-sm w-100 mt-2">
        <i class="bi bi-camera"></i> Capturar Foto
      </button>
      <canvas id="photo-canvas"></canvas>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('video-preview');
  const imgPreview = document.getElementById('img-preview');
  const btnSnap = document.getElementById('btnSnap');
  const canvas = document.getElementById('photo-canvas');
  let fotoBase64 = "";
  let streamActual = null;


  async function iniciarCamara() {
    try {
      streamActual = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = streamActual;
    } catch (err) {
      console.error("Error cámara:", err);
    }
  }

  btnSnap.addEventListener('click', () => {
    if (video.style.display !== 'none') {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      fotoBase64 = canvas.toDataURL('image/png');
      imgPreview.src = fotoBase64;
      imgPreview.style.display = 'block';
      video.style.display = 'none';
      btnSnap.innerHTML = '<i class="bi bi-arrow-repeat"></i> Volver a tomar';
    } else {
      imgPreview.style.display = 'none';
      video.style.display = 'block';
      btnSnap.innerHTML = '<i class="bi bi-camera"></i> Capturar Foto';
    }
  });

  async function enviar() {
    const resDiv = document.getElementById('resultado');
    resDiv.className = "mt-3 small text-center fw-bold text-muted";
    resDiv.innerText = "Procesando gRPC...";

    const payload = {
      usuario: document.getElementById('usuario').value,
      password: document.getElementById('password').value,
      nombre: document.getElementById('nombre').value,
      sector: document.getElementById('sector').value,
      nivelEscolar: document.getElementById('nivel').value,
      fotoBase64: fotoBase64,
      ubicacion: {
        latitud: parseFloat(document.getElementById('lat').value),
        longitud: parseFloat(document.getElementById('lon').value)
      }
    };

    try {
      const response = await fetch('/api/grpc/procesar', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      if(response.ok) {
        resDiv.className = "mt-3 small text-center fw-bold text-success";
        resDiv.innerText = (data.mensaje || "Sincronizado con éxito");
      } else {
        throw new Error("Error en servidor");
      }
    } catch (error) {
      resDiv.className = "mt-3 small text-center fw-bold text-danger";
      resDiv.innerText = "X Error en la comunicación gRPC";
    }
  }

  iniciarCamara();
</script>
</body>
</html>
