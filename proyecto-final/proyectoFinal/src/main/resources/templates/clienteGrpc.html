<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <title>Cliente gRPC</title>
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-custom { border-radius: 15px; border: none; background: white; }
    .label-custom { font-size: 0.7rem; font-weight: 800; color: #495057; text-transform: uppercase; letter-spacing: 0.5px; }

    #video-preview, #img-preview {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 12px;
      background: #212529;
      object-fit: cover;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .form-control-sm { border-radius: 8px; padding: 0.5rem; }
    .btn-grpc { border-radius: 10px; padding: 12px; font-weight: bold; transition: all 0.3s; }
    .btn-grpc:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="container py-3 py-md-5">

<div th:replace="~{templates/menu.html :: menu}"></div>

<div class="d-flex align-items-center gap-2 mb-4">
  <a href="/encuesta" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
    <i class="bi bi-arrow-left"></i> Volver
  </a>
  <h4 class="mb-0 fw-bold"><i class="bi bi-cpu-fill text-primary"></i> Terminal gRPC</h4>
</div>

<div class="row g-4">
  <div class="col-12 col-lg-4 order-1 order-lg-2">
    <div class="card card-custom p-3 shadow-sm text-center">
      <label class="label-custom d-block mb-3 text-start"><i class="bi bi-camera-fill"></i> Evidencia Fotográfica</label>

      <div class="position-relative">
        <video id="video-preview" autoplay playsinline></video>
        <img id="img-preview" style="display: none;">
      </div>

      <button type="button" id="btnSnap" class="btn btn-dark w-100 mt-3 btn-grpc">
        <i class="bi bi-camera"></i> Capturar Foto
      </button>
      <canvas id="photo-canvas" style="display: none;"></canvas>
    </div>
  </div>

  <div class="col-12 col-lg-8 order-2 order-lg-1">
    <div class="card card-custom p-4 shadow-sm">

      <div class="mb-4">
        <p class="small fw-bold text-primary mb-3"><i class="bi bi-shield-lock"></i> Autenticación de Seguridad</p>
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="label-custom">Usuario (Email)</label>
            <input type="text" id="usuario" class="form-control form-control-sm" placeholder="ejemplo@correo.com">
          </div>
          <div class="col-12 col-md-6">
            <label class="label-custom">Contraseña</label>
            <input type="password" id="password" class="form-control form-control-sm" placeholder="********">
          </div>
        </div>
      </div>

      <hr class="my-4 opacity-25">

      <p class="small fw-bold text-primary mb-3"><i class="bi bi-file-earmark-text"></i> Datos de la Encuesta</p>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="label-custom">Nombre Completo</label>
          <input type="text" id="nombre" class="form-control form-control-sm">
        </div>
        <div class="col-12 col-md-6">
          <label class="label-custom">Sector / Localidad</label>
          <input type="text" id="sector" class="form-control form-control-sm">
        </div>
        <div class="col-12 col-md-4">
          <label class="label-custom">Nivel Escolar</label>
          <select id="nivel" class="form-select form-select-sm">
            <option value="BASICO">Básico</option>
            <option value="MEDIO">Medio</option>
            <option value="UNIVERSITARIO" selected>Universitario</option>
            <option value="POSTGRADO">Postgrado</option>
          </select>
        </div>
        <div class="col-6 col-md-4">
          <label class="label-custom">Latitud</label>
          <input type="text" id="lat" class="form-control form-control-sm bg-light" readonly value="18.4749">
        </div>
        <div class="col-6 col-md-4">
          <label class="label-custom">Longitud</label>
          <input type="text" id="lon" class="form-control form-control-sm bg-light" readonly value="-69.9307">
        </div>
      </div>

      <button class="btn btn-primary mt-4 w-100 btn-grpc shadow" onclick="enviar()">
        <i class="bi bi-cloud-arrow-up"></i> EJECUTAR LLAMADA gRPC
      </button>

      <div id="resultado" class="mt-3 p-2 rounded small text-center fw-bold"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const video = document.getElementById('video-preview');
  const imgPreview = document.getElementById('img-preview');
  const btnSnap = document.getElementById('btnSnap');
  const canvas = document.getElementById('photo-canvas');
  let fotoBase64 = "";
  let streamActual = null;


  async function iniciarCamara() {
    try {
      streamActual = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = streamActual;
    } catch (err) {
      console.error("Error cámara:", err);
    }
  }

  btnSnap.addEventListener('click', () => {
    if (video.style.display !== 'none') {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      fotoBase64 = canvas.toDataURL('image/png');
      imgPreview.src = fotoBase64;
      imgPreview.style.display = 'block';
      video.style.display = 'none';
      btnSnap.innerHTML = '<i class="bi bi-arrow-repeat"></i> Volver a tomar';
    } else {
      imgPreview.style.display = 'none';
      video.style.display = 'block';
      btnSnap.innerHTML = '<i class="bi bi-camera"></i> Capturar Foto';
    }
  });

  async function enviar() {
    const resDiv = document.getElementById('resultado');
    resDiv.className = "mt-3 small text-center fw-bold text-muted";
    resDiv.innerText = "Procesando gRPC...";

    const payload = {
      usuario: document.getElementById('usuario').value,
      password: document.getElementById('password').value,
      nombre: document.getElementById('nombre').value,
      sector: document.getElementById('sector').value,
      nivelEscolar: document.getElementById('nivel').value,
      fotoBase64: fotoBase64,
      ubicacion: {
        latitud: parseFloat(document.getElementById('lat').value),
        longitud: parseFloat(document.getElementById('lon').value)
      }
    };

    try {
      const response = await fetch('/api/grpc/procesar', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      if(response.ok) {
        resDiv.className = "mt-3 small text-center fw-bold text-success";
        resDiv.innerText = (data.mensaje || "Sincronizado con éxito");
      } else {
        throw new Error("Error en servidor");
      }
    } catch (error) {
      resDiv.className = "mt-3 small text-center fw-bold text-danger";
      resDiv.innerText = "X Error en la comunicación gRPC";
    }
  }

  iniciarCamara();
</script>
</body>
</html>
