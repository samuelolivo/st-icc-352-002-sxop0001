<div th:fragment="menu" class="d-flex justify-content-end align-items-center gap-2">
  <div class="d-flex justify-content-end align-items-center gap-2">
    <a href="/usuarios" class="btn btn-secondary position-relative text-white fw-bold">
      Usuarios </a>
    <a href="/encuesta" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
      <span>Encuestas</span>
    </a>
    <a href="/encuesta/mapa" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
      <span>Mapa</span>
    </a>
  </div>

  <div th:if="${nombre == null}">
    <a href="/login" class="btn btn-primary text-white fw-bold">
      Iniciar Sesión
    </a>
  </div>

  <div th:if="${nombre != null}"
       class="d-flex align-items-center gap-2">

        <span class="text-muted small"
              th:text="${'Hola, ' + nombre}">
        </span>

    <a href="/logout" class="btn btn-outline-danger fw-bold">
      Cerrar Sesión
    </a>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
              .then(registration => {
                console.log('ServiceWorker registrado con éxito con alcance:', registration.scope);
              })
              .catch(error => {
                console.error('El registro del ServiceWorker falló:', error);
              });
    });
  }
</script>
