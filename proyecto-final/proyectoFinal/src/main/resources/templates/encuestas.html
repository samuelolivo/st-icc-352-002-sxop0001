<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Encuestas</title>
    <style>
        body { background-color: #f8f9fa; }
        .table-hover tbody tr.selected {
            background-color: rgba(13, 110, 253, 0.1);
            cursor: pointer;
            border-left: 5px solid #0d6efd;
        }
        tr { cursor: pointer; transition: all 0.2s; }
        .table { background: white; border-radius: 8px; overflow: hidden; }
        .img-miniatura { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .gap-2 { gap: 0.5rem !important; }
    </style>
</head>
<body class="container mt-5">

<div th:replace="~{templates/menu.html :: menu}"></div>

<div class="row align-items-center mb-4">
    <div class="col-md-6">
        <h2 class="fw-bold text-dark">Listado de Encuestas</h2>
    </div>
</div>

<div th:if="${rol != null and (rol == 'ADMIN' or rol == 'ENCUESTADOR')}">
    <div th:replace="~{templates/botonesCrud.html :: botonesCrud(true)}"></div>
</div>

<table class="table table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
        <th class="py-3 ps-4">Foto</th>
        <th class="py-3">Nombre</th>
        <th class="py-3">Sector</th>
        <th class="py-3">Nivel Escolar</th>
        <th class="py-3 text-center">Ubicación</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${encuestas}" th:attr="data-id=${e.id}" class="encuesta-row">
        <td class="ps-4">
            <img th:if="${e.fotoBase64 != null}" th:src="${e.fotoBase64}" class="img-miniatura shadow-sm">
            <span th:if="${e.fotoBase64 == null}" class="text-muted small">Sin foto</span>
        </td>
        <td th:text="${e.nombre}" class="fw-bold"></td>
        <td th:text="${e.sector}"></td>
        <td th:text="${e.nivelEscolar}"></td>
        <td class="text-center">
            <span class="badge bg-info text-dark"
                  th:text="${e.ubicacion != null} ? ${e.ubicacion.latitud + ', ' + e.ubicacion.longitud} : 'Sin GPS'"></span>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(encuestas)}">
        <td colspan="5" class="text-center py-4 text-muted">No hay encuestas registradas</td>
    </tr>
    </tbody>
</table>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/serviceworker.js', { scope: '/' })
                .then(registration => {
                    console.log('Service Worker registrado con éxito:', registration.scope);
                })
                .catch(error => {
                    console.log('Fallo en el registro del Service Worker:', error);
                });
        });
    }
</script>

<script type="module">
    import { getEncuestasPendientes, clearEncuestaSincronizada } from '/js/storage.js';

    const rows = document.querySelectorAll('.encuesta-row');
    const btnCrear = document.getElementById('btnCrear');
    const btnEditar = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');

    rows.forEach(row => {
        row.addEventListener('click', () => {
            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');

            const id = row.getAttribute('data-id');

            btnEditar.classList.remove('disabled');
            btnEditar.dataset.target = `/encuestador/encuesta/editar/${id}`;

            btnEliminar.classList.remove('disabled');
            btnEliminar.dataset.target = `/encuestador/encuesta/eliminar/${id}`;
        });
    });

    btnCrear.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = "/encuestador/encuesta/crear";
    });

    btnEditar.addEventListener('click', (e) => {
        e.preventDefault();
        if (!btnEditar.classList.contains('disabled') && btnEditar.dataset.target) {
            window.location.href = btnEditar.dataset.target;
        }
    });

    btnEliminar.addEventListener('click', (e) => {
        e.preventDefault();
        if (!btnEliminar.classList.contains('disabled') && btnEliminar.dataset.target) {
            if (confirm('¿Seguro que deseas eliminar esta encuesta?')) {
                window.location.href = btnEliminar.dataset.target;
            }
        }
    });

    const btnSync = document.getElementById('btnSync');
    const badgeSync = document.getElementById('badgeSync');

    async function revisarPendientes() {
        try {
            const pendientes = await getEncuestasPendientes();
            if (btnSync && pendientes.length > 0) {
                btnSync.classList.remove('d-none');
                btnSync.classList.add('d-inline-flex');
                badgeSync.innerText = pendientes.length;
            } else if (btnSync) {
                btnSync.classList.add('d-none');
                btnSync.classList.remove('d-inline-flex');
            }
        } catch (err) {
            console.error("Error leyendo IndexedDB:", err);
        }
    }

    revisarPendientes();

    btnSync.addEventListener('click', async (e) => {
        e.preventDefault();

        if (!navigator.onLine) {
            alert("No tienes conexión a internet en este momento. Conéctate a un Wi-Fi o enciende los datos para sincronizar.");
            return;
        }

        const contenidoOriginal = btnSync.innerHTML;
        btnSync.disabled = true;
        btnSync.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Subiendo...';

        try {
            const pendientes = await getEncuestasPendientes();
            let sincronizadas = 0;

            for (const encuesta of pendientes) {
                const response = await fetch('/encuestador/encuesta/sincronizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(encuesta)
                });

                if (response.ok) {
                    await clearEncuestaSincronizada(encuesta.localId);
                    sincronizadas++;
                } else {
                    console.error("Falló la encuesta con localId:", encuesta.localId);
                }
            }

            if (sincronizadas > 0) {
                alert(`Se han sincronizado ${sincronizadas} de ${pendientes.length} encuestas.`);
                window.location.reload();
            } else {
                alert("No se pudo sincronizar ninguna encuesta. Verifica tu conexión.");
                btnSync.innerHTML = contenidoOriginal;
                btnSync.disabled = false;
            }

        } catch (error) {
            console.error("Error durante la sincronización:", error);
            alert("Error de red al intentar sincronizar.");
            btnSync.innerHTML = contenidoOriginal;
            btnSync.disabled = false;
        }
    });
</script>

</body>
</html>
