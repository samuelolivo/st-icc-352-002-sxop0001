<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Panel de Administracion - Encuestas</title>
    <style>
        body { background-color: #f8f9fa; }
        .table-hover tbody tr.selected {
            background-color: rgba(13, 110, 253, 0.1);
            cursor: pointer;
            border-left: 5px solid #0d6efd;
        }
        tr { cursor: pointer; transition: all 0.2s; }
        .table { background: white; border-radius: 8px; overflow: hidden; }
        .img-miniatura { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .gap-2 { gap: 0.5rem !important; }
    </style>
</head>
<body class="container mt-5">

<div class="row align-items-center mb-4">
    <div class="col-md-6">
        <h2 class="fw-bold text-dark">Listado de Encuestas</h2>
    </div>
    <div class="col-md-6 text-end">
        <a href="/encuesta/mapa" class="btn btn-outline-primary shadow-sm">Ver Mapa</a>
    </div>
</div>

<div class="row mb-4">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mt-2">
            <div>
                <a
                   href="/usuario/lista" class="btn btn-dark px-4 shadow-sm">Gestionar Usuarios</a>
            </div>

            <div class="d-flex gap-2">
                <a href="/encuesta/crear" class="btn btn-success px-4 shadow-sm">Crear Encuesta</a>

                <a id="btnEditar" href="#" class="btn btn-warning disabled px-4 shadow-sm">Editar</a>
                <a id="btnEliminar" href="#" class="btn btn-danger disabled px-4 shadow-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar esta encuesta?')">Eliminar</a>
            </div>
        </div>
    </div>
</div>

<table class="table table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
        <th class="py-3 ps-4">Foto</th>
        <th class="py-3">Nombre</th>
        <th class="py-3">Sector</th>
        <th class="py-3">Nivel Escolar</th>
        <th class="py-3 text-center">Ubicación</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${encuestas}" th:attr="data-id=${e.id}" class="encuesta-row">
        <td class="ps-4">
            <img th:if="${e.fotoBase64 != null}" th:src="${e.fotoBase64}" class="img-miniatura shadow-sm">
            <span th:if="${e.fotoBase64 == null}" class="text-muted small">Sin foto</span>
        </td>
        <td th:text="${e.nombre}" class="fw-bold"></td>
        <td th:text="${e.sector}"></td>
        <td th:text="${e.nivelEscolar}"></td>
        <td class="text-center">
            <span class="badge bg-info text-dark"
                  th:text="${e.ubicacion != null} ? ${e.ubicacion.latitud + ', ' + e.ubicacion.longitud} : 'Sin GPS'"></span>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(encuestas)}">
        <td colspan="5" class="text-center py-4 text-muted">No hay encuestas registradas</td>
    </tr>
    </tbody>
</table>

<script>
    const rows = document.querySelectorAll('.encuesta-row');
    const btnEditar = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');

    rows.forEach(row => {
        row.addEventListener('click', () => {
            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
            const id = row.getAttribute('data-id');

            if (btnEditar && btnEliminar) {
                btnEditar.classList.remove('disabled');
                btnEditar.href = `/admin/encuesta/editar/${id}`;

                btnEliminar.classList.remove('disabled');
                btnEliminar.href = `/admin/encuesta/eliminar/${id}`;
            }
        });
    });
</script>

</body>
</html>
