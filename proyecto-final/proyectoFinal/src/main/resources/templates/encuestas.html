<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Encuestas</title>
    <style>
        body { background-color: #f8f9fa; }

        /* Estilos de Selección para Tabla Local */
        #tbodyLocal tr.selected {
            background-color: rgba(13, 110, 253, 0.08) !important;
            border-left: 5px solid #0d6efd;
        }
        #tbodyLocal tr { cursor: pointer; transition: background 0.2s; }
        .table { background: white; border-radius: 12px; overflow: hidden; }
        .img-miniatura { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid #dee2e6; }
        @media (max-width: 768px) {
            .hide-mobile { display: none; }
            .h2-responsive { font-size: 1.5rem; }
            .badge-gps { font-size: 0.7rem; }
        }
    </style>
</head>
<body class="container py-3 py-md-5">

<div th:replace="~{templates/menu.html :: menu}"></div>

<div class="row align-items-center mb-4 g-3">
    <div class="col-12 col-md-6 text-center text-md-start">
        <h2 class="fw-bold text-dark h2-responsive">Listado de Encuestas</h2>
    </div>
</div>

<div th:if="${rol != null and (rol == 'ADMIN' or rol == 'ENCUESTADOR')}" class="mb-4">
    <div th:replace="~{templates/botonesCrud.html :: botonesCrud(false, true, false, false)}"></div>
</div>

<div id="contenedorLocal" class="d-none">
    <div class="alert alert-warning border-0 shadow-sm d-flex align-items-center mb-3">
        <i class="bi bi-wifi-off fs-4 me-2"></i>
        <h5 class="fw-bold mb-0 text-dark">Pendientes de Sincronizar</h5>
    </div>

    <div th:if="${rol != null and (rol == 'ADMIN' or rol == 'ENCUESTADOR')}" class="mb-3">
        <div th:replace="~{templates/botonesCrud.html :: botonesCrud(true, false, true, true)}"></div>
    </div>

    <div class="table-responsive shadow-sm mb-5 rounded-3">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-warning small text-uppercase fw-bold">
            <tr>
                <th class="py-3 ps-4">Foto</th>
                <th>Nombre</th>
                <th class="hide-mobile">Sector</th>
                <th class="hide-mobile">Nivel</th>
                <th class="text-center">Ubicación</th>
            </tr>
            </thead>
            <tbody id="tbodyLocal"></tbody>
        </table>
    </div>

    <div class="d-flex align-items-center mb-3">
        <hr class="flex-grow-1">
        <span class="mx-3 text-muted fw-bold small text-uppercase">Datos Sincronizados</span>
        <hr class="flex-grow-1">
    </div>
</div>

<div class="table-responsive shadow-sm rounded-3">
    <table class="table table-hover align-middle mb-0" id="tablaServidor">
        <thead class="table-dark small text-uppercase fw-bold">
        <tr>
            <th class="py-3 ps-4">Foto</th>
            <th>Nombre</th>
            <th class="hide-mobile">Sector</th>
            <th class="hide-mobile">Nivel Escolar</th>
            <th class="text-center">Ubicación</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${encuestas}" th:attr="data-id=${e.id}" class="encuesta-row">
            <td class="ps-4">
                <img th:if="${e.fotoBase64 != null}"
                     th:src="${#strings.startsWith(e.fotoBase64, 'data:') ? e.fotoBase64 : 'data:image/jpeg;base64,' + e.fotoBase64}"
                     class="img-miniatura shadow-sm">
                <div th:if="${e.fotoBase64 == null}" class="bg-light img-miniatura d-flex align-items-center justify-content-center">
                    <i class="bi bi-image text-muted"></i>
                </div>
            </td>
            <td>
                <span th:text="${e.nombre}" class="fw-bold text-dark d-block"></span>
                <span th:text="${e.sector}" class="d-md-none text-muted small"></span>
            </td>
            <td th:text="${e.sector}" class="hide-mobile"></td>
            <td th:text="${e.nivelEscolar}" class="hide-mobile"></td>
            <td class="text-center">
                <span th:if="${e.ubicacion != null}" class="badge bg-info text-dark rounded-pill badge-gps">
                    <i class="bi bi-geo-alt-fill"></i> <span th:text="${e.ubicacion.latitud + ', ' + e.ubicacion.longitud}" class="hide-mobile"></span>
                </span>
                <span th:if="${e.ubicacion == null}" class="badge bg-light text-muted rounded-pill">N/A</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(encuestas)}">
            <td colspan="5" class="text-center py-5 text-muted">
                <i class="bi bi-cloud-slash fs-1 d-block mb-2"></i>
                No hay encuestas en el servidor
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/serviceworker.js', { scope: '/' })
                .then(registration => {
                    console.log('Service Worker registrado con éxito:', registration.scope);
                })
                .catch(error => {
                    console.log('Fallo en el registro del Service Worker:', error);
                });
        });
    }
</script>

<script type="module">
    import { getEncuestasPendientes, clearEncuestaSincronizada } from '/js/storage.js';

    const btnCrear = document.getElementById('btnCrear');
    const btnEditar = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');
    const btnSync = document.getElementById('btnSync');
    const badgeSync = document.getElementById('badgeSync');

    const contenedorLocal = document.getElementById('contenedorLocal');
    const tbodyLocal = document.getElementById('tbodyLocal');

    let idSeleccionado = null;
    let tipoSeleccionado = null;

    function limpiarSelecciones() {
        // Solo limpiamos las filas de la tabla local
        document.querySelectorAll('#tbodyLocal tr').forEach(r => r.classList.remove('selected'));
        if(btnEditar) btnEditar.classList.add('disabled');
        if(btnEliminar) btnEliminar.classList.add('disabled');
        idSeleccionado = null;
        tipoSeleccionado = null;
    }

    async function cargarTablaLocal() {
        try {
            const pendientes = await getEncuestasPendientes();

            if (btnSync && pendientes.length > 0) {
                btnSync.classList.remove('d-none');
                btnSync.classList.add('d-inline-flex');
                badgeSync.innerText = pendientes.length;

                contenedorLocal.classList.remove('d-none');
                tbodyLocal.innerHTML = '';

                pendientes.forEach(e => {
                    const tr = document.createElement('tr');

                    const fotoHtml = e.fotoBase64 ? `<img src="${e.fotoBase64}" class="img-miniatura shadow-sm">` : `<span class="text-muted small">Sin foto</span>`;
                    const ubiHtml = e.ubicacion ? `<span class="badge bg-warning text-dark">${e.ubicacion.latitud}, ${e.ubicacion.longitud}</span>` : `<span class="badge bg-secondary">Sin GPS</span>`;

                    tr.innerHTML = `
                        <td class="ps-4">${fotoHtml}</td>
                        <td class="fw-bold">${e.nombre}</td>
                        <td>${e.sector}</td>
                        <td>${e.nivelEscolar}</td>
                        <td class="text-center">${ubiHtml}</td>
                    `;

                    tr.addEventListener('click', () => {
                        limpiarSelecciones();
                        tr.classList.add('selected');
                        idSeleccionado = e.localId;
                        tipoSeleccionado = 'local';
                        if(btnEditar) btnEditar.classList.remove('disabled');
                        if(btnEliminar) btnEliminar.classList.remove('disabled');
                    });

                    tbodyLocal.appendChild(tr);
                });

            } else {
                if(btnSync) {
                    btnSync.classList.add('d-none');
                    btnSync.classList.remove('d-inline-flex');
                }
                contenedorLocal.classList.add('d-none');
            }
        } catch (err) {
            console.error(err);
        }
    }

    if(btnCrear) {
        btnCrear.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = "/encuestador/encuesta/crear";
        });
    }

    if(btnEditar) {
        btnEditar.addEventListener('click', (e) => {
            e.preventDefault();
            if (btnEditar.classList.contains('disabled')) return;

            // Solo procesamos si es local (por seguridad)
            if (tipoSeleccionado === 'local') {
                window.location.href = `/encuestador/encuesta/crear?localId=${idSeleccionado}`;
            }
        });
    }

    if(btnEliminar) {
        btnEliminar.addEventListener('click', async (e) => {
            e.preventDefault();
            if (btnEliminar.classList.contains('disabled')) return;

            if (confirm('¿Seguro que deseas eliminar esta encuesta pendiente?')) {
                if (tipoSeleccionado === 'local') {
                    await clearEncuestaSincronizada(idSeleccionado);
                    limpiarSelecciones();
                    cargarTablaLocal();
                }
            }
        });
    }

    if(btnSync) {
        btnSync.addEventListener('click', async (e) => {
            e.preventDefault();
            if (!navigator.onLine) {
                alert("No tienes conexión a internet en este momento.");
                return;
            }

            const contenidoOriginal = btnSync.innerHTML;
            btnSync.disabled = true;
            btnSync.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Subiendo...';

            try {
                const pendientes = await getEncuestasPendientes();
                let sincronizadas = 0;

                for (const encuesta of pendientes) {
                    const response = await fetch('/encuestador/encuesta/sincronizar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(encuesta)
                    });

                    if (response.ok) {
                        await clearEncuestaSincronizada(encuesta.localId);
                        sincronizadas++;
                    }
                }

                if (sincronizadas > 0) {
                    alert(`Se han sincronizado ${sincronizadas} encuestas.`);
                    window.location.reload();
                } else {
                    alert("Fallo al sincronizar. Verifica tu conexión.");
                }
            } catch (error) {
                alert("Error de red al intentar sincronizar.");
            } finally {
                btnSync.innerHTML = contenidoOriginal;
                btnSync.disabled = false;
            }
        });
    }

    cargarTablaLocal();
</script>

</body>
</html>
