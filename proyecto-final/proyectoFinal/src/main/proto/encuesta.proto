syntax = "proto3";


option java_multiple_files = true;
option java_package = "org.example.grpc";

package encuesta;

service EncuestaService {
  rpc Sincronizar(EncuestaRequest) returns (EncuestaResponse);
}

message EncuestaRequest {
  string nombre = 1;
  string sector = 2;
  string nivelEscolar = 3;
}

message EncuestaResponse {
  string mensaje = 1;
}