<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <title>Detalle del Producto</title>
  <style>
    body { background-color: #f8f9fa; }

    .carousel-item img {
      height: 450px;
      object-fit: contain;
      background-color: #e9ecef;
      border-radius: 8px;
    }

    .product-details {
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
      height: 100%;
    }
  </style>
</head>
<body class="container mt-5 mb-5">

<div class="row align-items-center mb-2">
  <div class="col-md-6">
    <h2 class="fw-bold text-dark">Ver producto</h2>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-2">
    <a href="/productos" class="btn btn-outline-secondary">Volver</a>
  </div>

</div>

<div class="row g-4">
  <div class="col-md-6">

    <div class="d-flex align-items-center justify-content-center gap-2" th:if="${producto.imagenes != null and !producto.imagenes.isEmpty()}">

      <button class="btn btn-link text-dark p-0 border-0" type="button"
              data-bs-target="#productCarousel" data-bs-slide="prev"
              th:if="${producto.imagenes.size() > 1}">
        <i class="bi bi-chevron-left" style="font-size: 2.5rem; stroke-width: 2px;"></i>
        <span class="visually-hidden">Anterior</span>
      </button>

      <div id="productCarousel" class="carousel slide shadow-sm rounded overflow-hidden flex-grow-1" data-bs-interval="false">

        <div class="carousel-indicators mb-1" th:if="${producto.imagenes.size() > 1}">
          <button th:each="img, iterStat : ${producto.imagenes}"
                  type="button"
                  data-bs-target="#productCarousel"
                  th:attr="data-bs-slide-to=${iterStat.index}"
                  th:classappend="${iterStat.index == 0} ? 'active' : ''"
                  style="background-color: #000;"></button> </div>

        <div class="carousel-inner">
          <div th:each="img, iterStat : ${producto.imagenes}"
               class="carousel-item"
               th:classappend="${iterStat.index == 0} ? 'active' : ''">
            <img th:src="${img}" class="d-block w-100" alt="Imagen del producto">
          </div>
        </div>
      </div>

      <button class="btn btn-link text-dark p-0 border-0" type="button"
              data-bs-target="#productCarousel" data-bs-slide="next"
              th:if="${producto.imagenes.size() > 1}">
        <i class="bi bi-chevron-right" style="font-size: 2.5rem; stroke-width: 2px;"></i>
        <span class="visually-hidden">Siguiente</span>
      </button>

    </div>

    <div th:unless="${producto.imagenes != null and !producto.imagenes.isEmpty()}" class="d-flex justify-content-center align-items-center bg-light rounded border shadow-sm" style="height: 450px;">
      <div class="text-center text-muted">
        <i class="bi bi-image opacity-50 mb-3" style="font-size: 4rem;"></i>
        <h5>Sin imagen disponible</h5>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="product-details d-flex flex-column">
        <span th:if="${producto.cantidad <= 0}" class="badge bg-danger mb-2 ms-1">Agotado</span>

        <h2 class="fw-bold mb-3 text-dark" th:text="${producto.nombre}"></h2>

        <h2 class="fw-bold mb-4" th:text="'$' + ${producto.precio}"></h2>

        <div class="mb-4">
          <h5 class="fw-bold text-secondary border-bottom pb-2">Descripción</h5>
          <p class="mt-3" style="white-space: pre-line;" th:text="${producto.descripcion}"></p>
        </div>

        <div class="mb-4">
          <h5 class="fw-bold text-secondary border-bottom pb-2">Disponibilidad</h5>
          <p class="mt-3">
            <span th:classappend="${producto.cantidad > 0} ? 'text-dark' : 'text-danger fw-bold'" th:text="${producto.cantidad} + ' unidades en stock'"></span>
          </p>
        </div>
    </div>
  </div>
</div>

<div class="row mt-5">
  <div class="col-12">
    <div class="product-details">
      <h4 class="fw-bold mb-4">Comentarios</h4>

      <div th:if="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}" class="mb-5">
        <form action="/comentarios/crear" method="post">
          <input type="hidden" name="productoId" th:value="${producto.id}">
          <div class="mb-3">
            <label class="form-label fw-bold">Escribe tu opinión:</label>
            <textarea name="contenido" class="form-control" rows="3" placeholder="¿Qué te pareció este producto?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Publicar comentario</button>
        </form>
      </div>
      <div th:unless="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}" class="alert alert-info">
        Debes <a href="/login" class="fw-bold">iniciar sesión</a> para dejar un comentario.
      </div>

      <hr>

      <div class="mt-4">
        <div th:each="com : ${comentarios}" class="card mb-3 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h6 class="fw-bold mb-1" th:text="${com.usuario}"></h6>
                <small class="text-muted" th:text="${#dates.format(com.fechaPublicacion, 'dd/MM/yyyy HH:mm')}"></small>
              </div>

              <a th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}"
                 th:href="@{'/admin/comentarios/eliminar/' + ${com.id} + '/' + ${producto.id}}"
                 class="btn btn-sm btn-outline-danger"
                 onclick="return confirm('¿Seguro que deseas eliminar este comentario?')">
                 Eliminar
              </a>
            </div>
            <p class="card-text mt-3" th:text="${com.contenido}"></p>
          </div>
        </div>

        <div th:if="${comentarios.isEmpty()}" class="text-center text-muted py-4">
          <p>Aún no hay comentarios.</p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
