<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Sistema - Modificar Inventario</title>
    <style>
        body { background-color: #e9ecef; }

        .edit-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-top: 50px;
        }

        .info-side {
            background: linear-gradient(135deg, #dc3545 0%, #a71d2a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .form-side { padding: 40px; }

        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row edit-container">
        <div class="col-md-4 info-side">
            <h2 class="mt-3 text-center">Edición de Producto</h2>
            <p class="text-center opacity-75">Actualice la información del producto</p>
            <div class="badge bg-dark mt-4 p-2"> ID Producto: <span th:text="${producto.id}">0</span></div>
        </div>

        <div class="col-md-8 form-side">
            <form action="/admin/actualizarProducto" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${producto.id}">

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Nombre del Producto</label>
                    <input type="text" name="nombre" class="form-control form-control-lg"
                           th:value="${producto.nombre}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" th:text="${producto.descripcion}" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Nuevas Imágenes (Opcional)</label>
                    <input type="file" name="imagenes" class="form-control" multiple accept="image/*">
                    <div class="form-text">Si seleccionas nuevas imágenes, reemplazarán a las anteriores.</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold text-secondary">Precio Unitario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">$</span>
                            <input type="number" step="0.01" name="precio" class="form-control"
                                   th:value="${producto.precio}" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold text-secondary">Stock Disponible</label>
                        <input type="number" name="cantidad" class="form-control"
                               th:value="${producto.cantidad}" min="0" required>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-danger btn-lg flex-grow-1">
                        Actualizar ahora
                    </button>
                    <a href="/productos" class="btn btn-outline-secondary btn-lg">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
