<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Crear producto</title>
</head>
<body class="container mt-5">

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3 class="card-title mb-0">Nuevo Producto</h3>
            </div>
            <div class="card-body">
                <form action="/admin/guardarProducto" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre del Producto</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                               placeholder="Hola Gustavo" required>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción del Producto</label>
                        <textarea id="descripcion" name="descripcion" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="imagenes" class="form-label">Imágenes (Obligatorio)</label>
                        <input type="file" id="imagenes" name="imagenes" class="form-control" multiple required accept="image/*">
                        <div class="form-text">Puedes seleccionar una o varias imágenes.</div>
                    </div>

                    <div class="mb-3">
                        <label for="precio" class="form-label">Precio</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" id="precio" name="precio" step="0.01"
                                   class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="form-text">Usa puntos para los decimales (ej: 19.99).</div>
                    </div>

                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Stock</label>
                        <input type="number" id="cantidad" name="cantidad" class="form-control"
                               placeholder="0" min="0" required>
                        <div class="form-text">Indica cuantas unidades tienes disponibles.</div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/productos" class="btn btn-secondary">Cancelar</a>

                        <button type="submit" class="btn btn-success">Guardar Producto</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
