<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Sistema - Modificar Evento</title>
  <style>
    body { background-color: #e9ecef; }

    .edit-container {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      margin-top: 50px;
    }

    .info-side {
      background: linear-gradient(135deg, #dc3545 0%, #a71d2a 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .form-side { padding: 40px; }

    .form-control:focus {
      border-color: #dc3545;
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row edit-container">
    <div class="col-md-4 info-side">
      <h2 class="mt-3 text-center">Edición de Evento</h2>
      <p class="text-center opacity-75">Actualice los detalles de la actividad</p>
      <div class="badge bg-dark mt-4 p-2"> ID Evento: <span th:text="${evento.id}">0</span></div>
    </div>

    <div class="col-md-8 form-side">
      <form action="/organizador/evento/actualizar" method="post">
        <input type="hidden" name="id" th:value="${evento.id}">

        <div class="mb-4">
          <label class="form-label fw-bold text-secondary">Título del Evento</label>
          <input type="text" name="titulo" class="form-control form-control-lg"
                 th:value="${evento.titulo}" required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold text-secondary">Descripción</label>
          <textarea name="descripcion" class="form-control" rows="3"
                    th:text="${evento.descripcion}" required></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold text-secondary">Fecha y Hora</label>
          <input type="datetime-local" name="fechaHora" class="form-control"
                 th:value="${evento.fechaHora}" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-4">
            <label class="form-label fw-bold text-secondary">Lugar / Ubicación</label>
            <input type="text" name="lugar" class="form-control"
                   th:value="${evento.lugar}" required>
          </div>
          <div class="col-md-6 mb-4">
            <label class="form-label fw-bold text-secondary">Cupo Máximo</label>
            <input type="number" name="cupoMaximo" class="form-control"
                   th:value="${evento.cupoMaximo}" min="1" required>
          </div>
        </div>

        <hr class="my-4">

        <div class="d-flex gap-3">
          <button type="submit" class="btn btn-danger btn-lg flex-grow-1">
            Actualizar ahora
          </button>
          <a href="/volver" class="btn btn-outline-secondary btn-lg">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
