<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Eventos</title>
  <style>
    body { background-color: #f8f9fa; }
    .table-hover tbody tr.selected {
      background-color: rgba(13, 110, 253, 0.1);
      cursor: pointer;
      border-left: 5px solid #0d6efd;
    }
    tr { cursor: pointer; transition: all 0.2s; }
    .table { background: white; border-radius: 8px; overflow: hidden; }
    .col-acciones { width: 120px; }
  </style>
</head>
<body class="container mt-5">

<div th:replace="templates/menu.html :: menu"></div>

<title th:text="${tituloVista != null ? tituloVista : 'Eventos'}">Eventos</title>

<div class="row align-items-center mb-2">
  <div class="col-md-6">
    <h2 class="fw-bold text-dark" th:text="${tituloVista != null ? tituloVista : 'Listado de Eventos'}">
      Eventos
    </h2>
  </div>
</div>

<div th:if="${usuario != null and (usuario.rol.name() == 'ADMIN' || usuario.rol.name() == 'ORGANIZADOR')}" class="row mb-4">
  <div class="col-12">
    <div class="d-flex gap-2 mt-2">
      <a href="/organizador/evento/crear" class="btn btn-success px-4 shadow-sm">Crear evento</a>
      <a id="btnEditar" href="#" class="btn btn-warning disabled px-4 shadow-sm">Editar</a>
      <a id="btnEliminar" href="#" class="btn btn-danger disabled px-4 shadow-sm"
         onclick="return confirm('Seguro que deseas eliminar este evento?')">Eliminar</a>
    </div>
  </div>
</div>

<table class="table table-hover shadow-sm">
  <thead class="table-dark">
  <tr>
    <th class="py-3 ps-4">Evento</th>
    <th class="py-3">Fecha y Hora</th>
    <th class="py-3">Lugar</th>
    <th class="py-3">Estado</th>
    <th class="py-3 text-center col-acciones">Acciones</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="e : ${eventos}"
      th:if="${e.publicado or (usuario != null and usuario.rol.name() != 'NO_AUTENTICADO' and usuario.rol.name() != 'PARTICIPANTE')}"
      th:attr="data-id=${e.id}" class="evento-row">
    <td th:text="${e.titulo}" class="fw-bold ps-4"></td>
    <td th:text="${#temporals.format(e.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
    <td th:text="${e.lugar}"></td>
    <td>
            <span th:classappend="${e.publicado} ? 'badge bg-success' : 'badge bg-secondary'"
                  th:text="${e.publicado} ? 'Publicado' : 'Borrador'"></span>
    </td>
    <td class="text-center">
      <div class="d-flex gap-2 justify-content-center">
        <a th:href="'/evento/ver/' + ${e.id}" class="btn btn-sm btn-outline-info fw-bold">Ver</a>

        <form th:if="${usuario != null && (usuario.rol.name() == 'ADMIN' || usuario.rol.name() == 'ORGANIZADOR')}"
              th:action="'/organizador/evento/publicar/' + ${e.id}" method="POST" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-outline-primary fw-bold"
                  th:text="${e.publicado} ? 'Ocultar' : 'Publicar'"></button>
        </form>
      </div>
    </td>
  </tr>
  </tbody>
</table>

<script>
  const rows = document.querySelectorAll('.evento-row');
  const btnEditar = document.getElementById('btnEditar');
  const btnEliminar = document.getElementById('btnEliminar');

  rows.forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.btn')) return;

      rows.forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      const id = row.getAttribute('data-id');

      if (btnEditar && btnEliminar) {
        btnEditar.classList.remove('disabled');
        btnEditar.href = `/organizador/evento/editar/${id}`;

        btnEliminar.classList.remove('disabled');
        btnEliminar.href = `/organizador/evento/eliminar/${id}`;
      }
    });
  });
</script>

</body>
</html>
