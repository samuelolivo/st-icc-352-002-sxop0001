<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Listar Eventos</title>
  <style>
    body { background-color: #f8f9fa; }
    .table-hover tbody tr.selected {
      background-color: rgba(13, 110, 253, 0.1);
      cursor: pointer;
      border-left: 5px solid #0d6efd;
    }
    tr { cursor: pointer; transition: all 0.2s; }
    .table { background: white; border-radius: 8px; overflow: hidden; }
    .col-acciones { width: 120px; }
  </style>
</head>
<body class="container mt-5">

<div class="row align-items-center mb-2">
  <div class="col-md-6">
    <h2 class="fw-bold text-dark">Listado de Eventos</h2>
  </div>

  <div class="d-flex justify-content-end align-items-center gap-2">
    <div class="d-flex justify-content-end align-items-center gap-2">
      <a href="/usuarios" class="btn btn-secondary position-relative text-white fw-bold">
        Usuarios </a>
      <a href="/mis-inscripciones" class="btn btn-secondary text-white fw-bold d-inline-flex align-items-center gap-2">
        <span>Mis Eventos</span>
      </a>
      <a th:if="${usuario != null && usuario.rol.name() == 'ADMIN'}" href="/admin/escanear-qr" class="btn btn-success text-white fw-bold">
        <i class="bi bi-qr-code-scan me-1"></i> Escanear QR
      </a>
      <a th:if="${usuario != null && usuario.rol.name() == 'ADMIN'}" href="/admin/estadisticas" class="btn btn-secondary text-white fw-bold">Estadísticas</a>
    </div>

    <div th:if="${usuario == null or usuario.rol.name() == 'NO_AUTENTICADO'}">
      <a href="/login" class="btn btn-primary text-white fw-bold">Iniciar Sesión</a>
    </div>

    <div th:if="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}" class="d-flex align-items-center gap-2">
      <span class="text-muted small" th:text="${'Hola, ' + usuario.usuario}"></span>
      <a href="/logout" class="btn btn-outline-danger fw-bold">Cerrar Sesión</a>
    </div>
  </div>
</div>

<div th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}" class="row mb-4">
  <div class="col-12">
    <hr>
    <div class="d-flex gap-2 mt-2">
      <a href="/admin/eventos/crear" class="btn btn-success px-4 shadow-sm">Crear evento</a>
      <a id="btnEditar" href="#" class="btn btn-warning disabled px-4 shadow-sm">Editar</a>
      <a id="btnEliminar" href="#" class="btn btn-danger disabled px-4 shadow-sm"
         onclick="return confirm('Seguro que deseas eliminar este evento?')">Eliminar</a>
    </div>
  </div>
</div>

<table class="table table-hover shadow-sm">
  <thead class="table-dark">
  <tr>
    <th class="py-3 ps-4">Evento</th>
    <th class="py-3">Fecha y Hora</th>
    <th class="py-3">Lugar</th>
    <th class="py-3">Estado</th>
    <th class="py-3 text-center col-acciones">Acciones</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="e : ${eventos}" th:attr="data-id=${e.id}" class="evento-row">
    <td th:text="${e.titulo}" class="fw-bold ps-4"></td>
    <td th:text="${#temporals.format(e.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
    <td th:text="${e.lugar}"></td>
    <td>
            <span th:classappend="${e.publicado} ? 'badge bg-success' : 'badge bg-secondary'"
                  th:text="${e.publicado} ? 'Publicado' : 'Borrador'"></span>
    </td>
    <td class="text-center">
      <div class="d-flex gap-2 justify-content-center">
        <a th:href="'/evento/ver/' + ${e.id}" class="btn btn-sm btn-outline-info fw-bold">Ver</a>

        <form th:if="${usuario != null && usuario.rol.name() == 'ADMIN'}"
              th:action="'/eventos/gestion/publicar/' + ${e.id}" method="POST" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-outline-primary fw-bold"
                  th:text="${e.publicado} ? 'Ocultar' : 'Publicar'"></button>
        </form>
      </div>
    </td>
  </tr>
  </tbody>
</table>

<script>
  const rows = document.querySelectorAll('.evento-row');
  const btnEditar = document.getElementById('btnEditar');
  const btnEliminar = document.getElementById('btnEliminar');

  rows.forEach(row => {
    row.addEventListener('click', (e) => {
      // Evita que el clic en botones de la fila active la selección
      if (e.target.closest('.btn')) return;

      rows.forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      const id = row.getAttribute('data-id');

      if (btnEditar && btnEliminar) {
        btnEditar.classList.remove('disabled');
        btnEditar.href = `/admin/evento/editar/${id}`;

        btnEliminar.classList.remove('disabled');
        btnEliminar.href = `/admin/evento/eliminar/${id}`;
      }
    });
  });
</script>

</body>
</html>
