<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Listar Usuarios</title>
    <style>
        body { background-color: #f8f9fa; }
        .table-hover tbody tr.selected {
            background-color: rgba(13, 110, 253, 0.1);
            cursor: pointer;
            border-left: 5px solid #0d6efd;
        }
        tr { cursor: pointer; transition: all 0.2s; }
        .table { background: white; border-radius: 8px; overflow: hidden; }
        .col-acciones { width: 150px; }
    </style>
</head>
<body class="container mt-5">

<div class="row align-items-center mb-2">
    <div class="col-md-6">
        <h2 class="fw-bold text-dark">Listado de Usuarios</h2>
    </div>

    <div class="d-flex justify-content-end align-items-center gap-2">
        <div th:if="${usuario == null or usuario.rol.name() == 'NO_AUTENTICADO'}">
            <a href="/login" class="btn btn-primary text-white fw-bold">Iniciar Sesión</a>
        </div>

        <div th:if="${usuario != null && usuario.rol.name() != 'NO_AUTENTICADO'}" class="d-flex align-items-center gap-2">
            <span class="text-muted small" th:text="${'Hola, ' + usuario.usuario}"></span>
            <a href="/logout" class="btn btn-outline-danger fw-bold">Cerrar Sesión</a>
        </div>
    </div>
</div>

<div th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}" class="row mb-4">
    <div class="col-12">
        <hr>
        <div class="d-flex gap-2 mt-2">
            <a href="/admin/usuario/crear" class="btn btn-success px-4 shadow-sm">Crear Usuario</a>
            <a id="btnEditar" href="#" class="btn btn-warning disabled px-4 shadow-sm">Editar</a>
            <a id="btnEliminar" href="#" class="btn btn-danger disabled px-4 shadow-sm"
               onclick="return confirm('Seguro que deseas eliminar este usuario?')">Eliminar</a>
        </div>
    </div>
</div>

<table class="table table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
        <th class="py-3 ps-4">Usuario</th>
        <th class="py-3">Rol</th>
        <th class="py-3">Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}" th:attr="data-id=${u.usuario}" class="usuario-row">
        <td th:text="${u.usuario}" class="ps-4"></td>
        <td th:text="${u.rol.getDescripcion()}"></td>
        <td th:text="${u.estado.getDescripcion()}"></td>
    </tr>
    </tbody>
</table>

<script>
    const rows = document.querySelectorAll('.usuario-row');
    const btnEditar = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');

    rows.forEach(row => {
        row.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn')) return;

            rows.forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');

            const id = row.getAttribute('data-id');

            if (id !== "admin") {
                if (btnEditar && btnEliminar) {
                    btnEditar.classList.remove('disabled');
                    btnEditar.href = `/admin/usuario/editar/${id}`;

                    btnEliminar.classList.remove('disabled');
                    btnEliminar.href = `/admin/usuario/eliminar/${id}`;
                }
            } else {
                if (btnEditar && btnEliminar) {
                    btnEditar.classList.add('disabled');
                    btnEditar.href = "#";

                    btnEliminar.classList.add('disabled');
                    btnEliminar.href = "#";
                }
            }
        });
    });
</script>

</body>
</html>
